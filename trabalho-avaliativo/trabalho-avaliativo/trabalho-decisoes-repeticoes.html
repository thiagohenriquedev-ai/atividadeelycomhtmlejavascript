<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trabalho avaliativo: decisões e repetições</title>
  <script src="scripts.js" defer></script>
</head>
<body>
  <h1>Trabalho avaliativo: decisões e repetições</h1>

  <!-- Q1 -->
  <h2>1. Controle de entrada em um evento</h2>
  <label for="idadeEvento">Idade: </label>
  <input type="text" id="idadeEvento">

  <label for="possuiIngresso">Possui ingresso (sim ou nao)? </label>
  <input type="text" id="possuiIngresso">

  <label for="possuiConvite">Possui convite (sim ou nao)? </label>
  <input type="text" id="possuiConvite">

  <label for="estaBloqueada">Está bloqueada (sim ou nao)? </label>
  <input type="text" id="estaBloqueada">

  <button type="button" id="btnEntradaEvento">Verificar entrada</button>
  <div id="saidaEntradaEvento"></div>

  <!-- Q2 -->
  <h2>2. Calculadora com switch</h2>
  <label for="calcNum1">Primeiro número: </label>
  <input type="text" id="calcNum1">

  <label for="calcNum2">Segundo número: </label>
  <input type="text" id="calcNum2">

  <label for="calcOperacao">Operação (+, -, *, /): </label>
  <input type="text" id="calcOperacao">

  <button type="button" id="btnCalcular">Calcular</button>
  <div id="saidaCalculadora"></div>

  <!-- Q3 -->
  <h2>3. Números pares e totalização com for</h2>
  <label for="numeroLimiteN">Número inteiro N (1 a 100): </label>
  <input type="text" id="numeroLimiteN">

  <button type="button" id="btnPares">Processar pares</button>
  <div id="saidaPares"></div>

  <!-- Q4 -->
  <h2>4. Simulação de economia com while</h2>
  <label for="metaEconomia">Meta de economia (1 a 10.000): </label>
  <input type="text" id="metaEconomia">

  <label for="depositoMensal">Depósito mensal fixo (1 a 10.000): </label>
  <input type="text" id="depositoMensal">

  <button type="button" id="btnSimularEconomia">Simular economia</button>
  <div id="saidaEconomia"></div>
</body>
</html>
